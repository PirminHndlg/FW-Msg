{% load i18n %}

<div class="modal fade" id="ampelCommentModal" tabindex="-1" aria-labelledby="ampelCommentModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <div class="d-flex flex-column w-100">
                    <div class="d-flex justify-content-between align-items-start w-100">
                        <h5 class="modal-title mb-0 d-flex align-items-center gap-2" id="ampelCommentModalLabel">
                            <div id="modalStatus" class="ampel-dot me-3"></div>
                            {% trans "Ampelmeldung" %}
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-light">
                        <a id="modalProfilLink" href="#" class="d-flex align-items-center gap-2 text-decoration-none" title="{% trans 'Profil ansehen' %}">
                            <img id="modalProfilPicture" src="" alt="{% trans 'Profilbild' %}"
                                 class="rounded-circle border flex-shrink-0 d-none"
                                 style="width: 36px; height: 36px; object-fit: cover;">
                            <i id="modalProfilIcon" class="bi bi-person-circle text-muted"></i>
                            <span id="modalUser" class="text-body fw-medium"></span>
                            <span id="modalLaender" class="d-flex align-items-center gap-1"></span>
                        </a>
                        <div class="d-flex align-items-center">
                            <i class="bi bi-clock me-2 text-muted"></i>
                            <span id="modalDate" class="text-muted small"></span>
                        </div>
                    </div>
                    <div id="modalManuell" class="small text-muted mt-2 d-none">
                        <i class="bi bi-building me-1"></i>{% trans 'Manuell eingetragen' %}
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <div class="comment-box p-3 bg-light rounded">
                    <p id="modalComment" class="mb-0"></p>
                </div>
            </div>

            <div id="modalRead" class="modal-footer">
                <a id="modalMessageBtn" href="#" class="btn btn-outline-primary">
                    <i class="bi bi-chat-dots"></i> {% trans 'Nachricht' %}
                </a>
                <button type="button" id="modalReadBtn" class="btn btn-primary" onclick="markAsRead()"><i class="bi bi-check-circle-fill"></i> {% trans 'Gelesen' %}</button>
            </div>
        </div>
    </div>
</div>

<script>
    let ampel_id = null;
    function markAsRead() {
        fetch(`{% url 'ampel_mark_as_read' %}?id=${ampel_id}`, {
            method: 'GET',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                $('#ampelCommentModal').modal('hide');
                window.location.reload();
            } else {
                alert(data.error);
            }
        })
        .catch(error => {
            alert('Error: ' + error);
        });
    }

    const ampelProfilUrl = "{% url 'profil' '__IDENTIFIER__' %}";
    const ampelProfilPictureUrl = "{% url 'serve_profil_picture' '__IDENTIFIER__' %}";

    function setAmpelModalUser(identifier, laender) {
        const link = document.getElementById('modalProfilLink');
        const picture = document.getElementById('modalProfilPicture');
        const icon = document.getElementById('modalProfilIcon');
        if (identifier) {
            const encoded = encodeURIComponent(identifier);
            link.href = ampelProfilUrl.replace('__IDENTIFIER__', encoded);
            link.classList.remove('pe-none');
            picture.src = ampelProfilPictureUrl.replace('__IDENTIFIER__', encoded);
            picture.classList.remove('d-none');
            icon.classList.add('d-none');
        } else {
            link.removeAttribute('href');
            link.classList.add('pe-none');
            picture.removeAttribute('src');
            picture.classList.add('d-none');
            icon.classList.remove('d-none');
        }

        const laenderContainer = document.getElementById('modalLaender');
        laenderContainer.replaceChildren();
        (laender || '').split(',').filter(code => /^[a-z]{2}$/i.test(code)).forEach(code => {
            const flag = document.createElement('span');
            flag.className = `fi fi-${code.toLowerCase()} border`;
            laenderContainer.appendChild(flag);
        });
    }

    function showAmpelComment(id, date, status, comment, user, read=false, manuell='False', identifier='', laender='') {
        const modal = new bootstrap.Modal(document.getElementById('ampelCommentModal'));
        document.getElementById('modalDate').textContent = date;
        document.getElementById('modalStatus').className = `ampel-dot ampel-${status}`;
        document.getElementById('modalComment').textContent = comment;
        document.getElementById('modalUser').textContent = user;
        setAmpelModalUser(identifier, laender);
        ampel_id = id;
        document.getElementById('modalMessageBtn').href = `/chat/for-ampel/${id}/`;
        $('#modalManuell').toggleClass('d-none', String(manuell).toLowerCase() !== 'true');
        if (read.toLowerCase() == 'true') {
            $('#modalReadBtn').addClass('d-none');
        } else {
            $('#modalReadBtn').removeClass('d-none');
        }
        modal.show();
    }
</script>
