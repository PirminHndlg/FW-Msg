{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartung | Maintenance</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-icons.min.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow text-center" style="max-width: 28rem;">
        <div class="card-body p-5">
            <i class="bi bi-tools text-primary" style="font-size: 3rem;"></i>
            <h1 class="fs-3 mt-3">Wartung</h1>
            <p class="text-muted mb-0">Maintenance</p>
            {% if maintenance_end_time %}
            <p class="mt-4 mb-1">Voraussichtlich fertig / Expected back:</p>
            <p class="fw-bold text-primary mb-0">{{ maintenance_end_time }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
