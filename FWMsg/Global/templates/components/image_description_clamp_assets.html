{% load i18n %}

<style>
  .image-description-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .image-description-clamp.clamp-3 {
    -webkit-line-clamp: 3;
  }
  .image-description-clamp.is-expanded {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
  }
</style>
<script>
  function toggleImageDescriptionClamp(link) {
    const description = link.previousElementSibling;
    if (!description || !description.classList.contains('image-description-clamp')) return;
    const expanded = description.classList.toggle('is-expanded');
    link.textContent = expanded ? '{% trans "weniger" %}' : '{% trans "mehr" %}';
  }

  function updateImageDescriptionClampToggles() {
    document.querySelectorAll('.image-description-clamp').forEach((description) => {
      const link = description.nextElementSibling;
      if (!link || !link.classList.contains('show-more')) return;
      if (description.classList.contains('is-expanded')) {
        link.hidden = false;
        return;
      }
      link.hidden = description.scrollHeight <= description.clientHeight + 1;
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateImageDescriptionClampToggles();
    requestAnimationFrame(updateImageDescriptionClampToggles);
  });
  window.addEventListener('resize', updateImageDescriptionClampToggles);
</script>
