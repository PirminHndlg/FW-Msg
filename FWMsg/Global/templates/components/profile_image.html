{% load i18n %}
{% load profil_filter %}

<div class="text-center">
    <div class="d-flex flex-column align-items-center">
        <div class="position-relative">
            <img src="{% url 'serve_profil_picture' displayed_user.customuser.get_identifier %}"
                 alt="{% trans 'Profilbild' %}"
                 class="rounded-circle mb-3"
                 style="width: min(200px, 50vw); object-fit: cover;">
            {% if this_user and displayed_user == request.user %}
            <div class="position-absolute bottom-0 end-0 mb-3 me-2">
                <form method="post" enctype="multipart/form-data" action="{% url 'update_profil_picture' %}" id="profilePictureForm">
                        {% csrf_token %}
                        <input type="file" class="d-none" name="profil_picture" id="profil_picture" accept="image/*" required>
                        <button type="button" class="btn btn-light btn-sm rounded-circle" onclick="document.getElementById('profil_picture').click()" title="{% trans 'Profilbild bearbeiten' %}">
                            <i class="bi bi-pencil"></i>
                        </button>
                </form>
            </div>
            <script>
                document.getElementById('profil_picture').addEventListener('change', function() {
                    if (this.files && this.files.length > 0) {
                        document.getElementById('profilePictureForm').submit();
                    }
                });
            </script>
            {% endif %}
        </div>
        {% with laender=displayed_user|get_laender %}
            {% if laender %}
            <div class="text-decoration-none d-flex flex-column align-items-center">
                <div class="d-flex align-items-center gap-2 flex-wrap justify-content-center">
                    {% for land_code in laender %}
                        <span class="fi fi-{{ land_code|lower }} mb-2 border" style="font-size: 3rem;"></span>
                    {% endfor %}
                </div>
            </div>
            {% else %}
                <i class="bi bi-globe mb-2" style="font-size: 3rem; color: var(--bs-primary);"></i>
            {% endif %}
        {% endwith %}
    </div>
</div>
