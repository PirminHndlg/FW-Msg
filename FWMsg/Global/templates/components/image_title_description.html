{% load i18n %}

{# Title + description below the user header (same placement as image_detail) #}
<div class="mb-3 mt-3">
  <h4 class="mb-2">{{ bild.titel }}</h4>
  {% if bild.beschreibung %}
    {% if truncate_description %}
      <p class="text-muted mb-0 image-description-clamp">{{ bild.beschreibung }}</p>
      <a href="#" class="show-more small" hidden onclick="event.preventDefault(); toggleImageDescriptionClamp(this);">{% trans "mehr" %}</a>
    {% else %}
      <p class="text-muted mb-0">{{ bild.beschreibung }}</p>
    {% endif %}
  {% endif %}
</div>
