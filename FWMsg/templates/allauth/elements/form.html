{% load allauth %}
<form method="{{ attrs.method }}" {% if attrs.action %}action="{{ attrs.action }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}>
    {% if attrs.form.non_field_errors %}
        <div class="alert alert-danger">{% for error in attrs.form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
    {% endif %}
    {% slot body %}
    {% endslot %}
    <div class="d-flex flex-wrap gap-2 mt-3">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
