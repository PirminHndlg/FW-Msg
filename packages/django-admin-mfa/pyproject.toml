[project]
name = "django-admin-mfa"
version = "0.3.1"
description = "2FA for the Django admin: django-allauth MFA (passkeys, TOTP) with per-site trusted-network rules"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    # admin_mfa.stages subclasses allauth's MFA login stage and relies on its
    # stage controller; tests/test_allauth_contract.py guards that. Raise the
    # upper bound only after running the suite against the new major.
    "django-allauth[mfa]>=65.22,<66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_mfa"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
