name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # git.npnan.com's runner (forgejo-runner1); see bazg-passar's test.yml.
    runs-on: "vlerp-ci"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          set -euo pipefail
          command -v uv >/dev/null && { uv --version; exit 0; }
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -p no:cacheprovider
