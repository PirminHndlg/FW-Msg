name: Security Audit

# Checks the pinned Python dependencies against known vulnerabilities (PyPI / OSV).
# Runs on changes to uv.lock and weekly, so new advisories are noticed
# even when nothing is committed.
on:
  push:
    branches: [ "main" ]
    paths: [ "pyproject.toml", "uv.lock", "packages/*/pyproject.toml", ".github/workflows/security-audit.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "pyproject.toml", "uv.lock", "packages/*/pyproject.toml", ".github/workflows/security-audit.yml" ]
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Export locked requirements
      # All groups (incl. dev and postgres), exact versions from uv.lock;
      # the local workspace package (packages/django-admin-mfa) is left out
      run: uv export --locked --all-groups --no-emit-workspace --no-hashes --format requirements-txt -o requirements-audit.txt

    - name: Audit locked requirements
      # All requirements are pinned, so they can be audited without installing them
      run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --desc on
