name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # bring up Redis alongside the runner
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # optional healthcheck so Actions waits until Redis is ready
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # make CELERY_BROKER_URL available to all steps
    env:
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    # Installs the Python version from .python-version and the exact versions
    # from uv.lock; fails if uv.lock is out of date with pyproject.toml.
    - name: Install Dependencies
      run: uv sync --locked

    - name: Setup Django Settings
      run: |
        cd FWMsg
        cp FWMsg/.example-secrets.json FWMsg/.secrets.json
        sed -i 's#/var/log/django/error.log#/tmp/django_error.log#g' FWMsg/settings.py
    - name: Setup npm dependencies
      run: npm ci --no-audit --no-fund
    - name: Run Tests
      run: |
        cd FWMsg
        uv run python manage.py collectstatic --noinput
        uv run python manage.py test --parallel 20 -v 3
